services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oksei}
      POSTGRES_USER: ${POSTGRES_USER:-oksei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-oksei} -d ${POSTGRES_DB:-oksei}']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-oksei}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oksei}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET обязателен}
      TOKEN_TTL: ${TOKEN_TTL:-720h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@oksei.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${HTTP_PORT:-80}:80'

volumes:
  pgdata:
